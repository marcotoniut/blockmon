[package]
name = "tree_v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "Independent re-derivation of the blockmon v1 authenticated state tree from its written spec"

[dependencies]
sha2 = "0.10"
serde_json = "1"
hex = "0.4"

[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_in_result = "deny"
get_unwrap = "deny"
todo = "deny"
unimplemented = "deny"
