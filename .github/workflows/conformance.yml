name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance-odin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
      - run: nix develop -c just lint
      - run: nix develop -c just kernel-test
      - run: nix develop -c just g0a
      # g0a regenerates both corpora and self-checks; the committed corpora must
      # be byte-identical or the generator has drifted from the archive.
      - run: git diff --exit-code conformance/vectors/
      - run: nix develop -c just g0b

  # Separate toolchain path on purpose: the G0c crate pins its own Rust via
  # rust-toolchain.toml (rustup honors it), independent of the nix devshell.
  conformance-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just g0c
